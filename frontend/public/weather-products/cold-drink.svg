<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0652DD"/>
      <stop offset="50%" style="stop-color:#1289A7"/>
      <stop offset="100%" style="stop-color:#12CBC4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.15)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.35)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.1)"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e55039"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="lemon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9ca24"/>
      <stop offset="100%" style="stop-color:#f0932b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Bubbles background -->
  <circle cx="60" cy="80" r="18" fill="rgba(255,255,255,0.06)"/>
  <circle cx="340" cy="120" r="25" fill="rgba(255,255,255,0.06)"/>
  <circle cx="50" cy="280" r="14" fill="rgba(255,255,255,0.06)"/>
  <circle cx="350" cy="300" r="20" fill="rgba(255,255,255,0.06)"/>
  <circle cx="100" cy="340" r="10" fill="rgba(255,255,255,0.06)"/>

  <!-- Glass shape -->
  <path d="M 148 100 L 162 320 L 238 320 L 252 100 Z" fill="url(#glass)" filter="url(#shadow)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

  <!-- Liquid inside glass -->
  <clipPath id="glassClip">
    <path d="M 150 100 L 164 318 L 236 318 L 250 100 Z"/>
  </clipPath>
  <rect x="148" y="170" width="104" height="150" fill="url(#liquid)" clip-path="url(#glassClip)" opacity="0.85"/>

  <!-- Ice cubes -->
  <rect x="160" y="175" width="34" height="34" rx="5" fill="rgba(255,255,255,0.7)" transform="rotate(10 177 192)" clip-path="url(#glassClip)"/>
  <rect x="202" y="172" width="34" height="34" rx="5" fill="rgba(255,255,255,0.65)" transform="rotate(-8 219 189)" clip-path="url(#glassClip)"/>
  <rect x="175" y="210" width="30" height="30" rx="5" fill="rgba(255,255,255,0.6)" transform="rotate(5 190 225)" clip-path="url(#glassClip)"/>
  <rect x="210" y="215" width="28" height="28" rx="5" fill="rgba(255,255,255,0.65)" transform="rotate(-12 224 229)" clip-path="url(#glassClip)"/>

  <!-- Liquid surface shine -->
  <ellipse cx="200" cy="172" rx="48" ry="8" fill="rgba(255,255,255,0.15)"/>

  <!-- Glass shine (left) -->
  <path d="M 155 115 L 160 280" stroke="rgba(255,255,255,0.35)" stroke-width="5" stroke-linecap="round"/>
  <!-- Glass shine (small) -->
  <path d="M 167 108 L 170 150" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round"/>

  <!-- Condensation drops on glass -->
  <circle cx="240" cy="180" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="245" cy="210" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="152" cy="230" r="3" fill="rgba(255,255,255,0.5)"/>
  <circle cx="147" cy="260" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="243" cy="260" r="2.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Straw -->
  <rect x="218" y="72" width="10" height="200" rx="5" fill="#e74c3c" transform="rotate(5 223 172)"/>
  <rect x="219" y="72" width="4" height="200" rx="2" fill="rgba(255,255,255,0.3)" transform="rotate(5 221 172)"/>

  <!-- Lemon slice on rim -->
  <circle cx="155" cy="100" r="28" fill="url(#lemon)" transform="rotate(-20 155 100)"/>
  <circle cx="155" cy="100" r="20" fill="#f9ca24" transform="rotate(-20 155 100)"/>
  <line x1="155" y1="80" x2="155" y2="120" stroke="#e67e22" stroke-width="1.5" transform="rotate(-20 155 100)"/>
  <line x1="135" y1="100" x2="175" y2="100" stroke="#e67e22" stroke-width="1.5" transform="rotate(-20 155 100)"/>
  <line x1="141" y1="86" x2="169" y2="114" stroke="#e67e22" stroke-width="1.5" transform="rotate(-20 155 100)"/>
  <line x1="141" y1="114" x2="169" y2="86" stroke="#e67e22" stroke-width="1.5" transform="rotate(-20 155 100)"/>
  <circle cx="155" cy="100" r="6" fill="#e67e22" transform="rotate(-20 155 100)"/>

  <!-- Mint leaves -->
  <ellipse cx="230" cy="88" rx="12" ry="7" fill="#27ae60" transform="rotate(-30 230 88)"/>
  <ellipse cx="244" cy="82" rx="12" ry="7" fill="#2ecc71" transform="rotate(15 244 82)"/>

  <!-- Bubbles in drink -->
  <circle cx="178" cy="270" r="4" fill="rgba(255,255,255,0.4)" clip-path="url(#glassClip)"/>
  <circle cx="210" cy="285" r="3" fill="rgba(255,255,255,0.35)" clip-path="url(#glassClip)"/>
  <circle cx="195" cy="255" r="5" fill="rgba(255,255,255,0.3)" clip-path="url(#glassClip)"/>

  <!-- Label -->
  <rect x="70" y="348" width="260" height="38" rx="19" fill="rgba(255,255,255,0.9)"/>
  <text x="200" y="372" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#0652DD" text-anchor="middle" letter-spacing="1">COLD DRINK</text>
</svg>
