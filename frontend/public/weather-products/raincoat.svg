<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a252f"/>
      <stop offset="50%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f"/>
      <stop offset="100%" style="stop-color:#d4ac0d"/>
    </linearGradient>
    <linearGradient id="coatShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4ac0d"/>
      <stop offset="100%" style="stop-color:#b7950b"/>
    </linearGradient>
    <linearGradient id="coatDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b7950b"/>
      <stop offset="100%" style="stop-color:#9a7d0a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Rain streaks -->
  <g stroke="rgba(100,180,255,0.25)" stroke-width="1.5" stroke-linecap="round">
    <line x1="48" y1="30" x2="40" y2="65"/>
    <line x1="78" y1="22" x2="70" y2="57"/>
    <line x1="338" y1="30" x2="330" y2="65"/>
    <line x1="365" y1="22" x2="357" y2="57"/>
    <line x1="30" y1="125" x2="22" y2="160"/>
    <line x1="55" y1="110" x2="47" y2="145"/>
    <line x1="355" y1="125" x2="347" y2="160"/>
    <line x1="372" y1="105" x2="364" y2="140"/>
    <line x1="38" y1="315" x2="30" y2="350"/>
    <line x1="62" y1="300" x2="54" y2="335"/>
    <line x1="348" y1="315" x2="340" y2="350"/>
    <line x1="372" y1="300" x2="364" y2="335"/>
    <line x1="23" y1="220" x2="15" y2="255"/>
    <line x1="378" y1="220" x2="370" y2="255"/>
  </g>

  <!-- LEFT SLEEVE -->
  <path d="M 110 168 L 58 172 Q 35 178 33 218 L 40 300 Q 42 316 62 316 L 118 310 Z"
    fill="url(#coat)" filter="url(#shadow)"/>
  <path d="M 110 168 L 82 172 L 75 300 L 118 300 Z" fill="url(#coatShade)" opacity="0.5"/>

  <!-- RIGHT SLEEVE -->
  <path d="M 290 168 L 342 172 Q 365 178 367 218 L 360 300 Q 358 316 338 316 L 282 310 Z"
    fill="url(#coat)" filter="url(#shadow)"/>
  <path d="M 290 168 L 318 172 L 325 300 L 282 300 Z" fill="url(#coatShade)" opacity="0.5"/>

  <!-- MAIN BODY -->
  <path d="M 115 152 L 102 330 Q 102 348 122 348 L 278 348 Q 298 348 298 330 L 285 152 Z"
    fill="url(#coat)" filter="url(#shadow)"/>

  <!-- Body right shadow panel -->
  <path d="M 200 152 L 200 348 L 278 348 Q 295 348 295 330 L 283 152 Z" fill="url(#coatShade)" opacity="0.45"/>

  <!-- HOOD -->
  <path d="M 145 152 Q 140 105 170 85 Q 190 70 200 68 Q 210 70 230 85 Q 260 105 255 152 Z"
    fill="url(#coat)" filter="url(#shadow)"/>
  <!-- Hood inner shadow -->
  <path d="M 155 152 Q 152 115 175 95 Q 192 80 200 78 Q 208 80 225 95 Q 248 115 245 152 Z"
    fill="url(#coatShade)" opacity="0.4"/>
  <!-- Hood opening (dark inside) -->
  <ellipse cx="200" cy="140" rx="32" ry="28" fill="rgba(0,0,0,0.4)"/>
  <ellipse cx="200" cy="135" rx="24" ry="20" fill="rgba(0,0,0,0.5)"/>

  <!-- Hood rim -->
  <path d="M 155 152 Q 145 135 152 112 Q 162 92 180 82 Q 192 75 200 74 Q 208 75 220 82 Q 238 92 248 112 Q 255 135 245 152"
    stroke="url(#coatDark)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Center button placket -->
  <rect x="193" y="155" width="14" height="185" rx="4" fill="url(#coatShade)"/>
  <!-- Buttons -->
  <circle cx="200" cy="185" r="6" fill="url(#coatDark)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  <circle cx="200" cy="215" r="6" fill="url(#coatDark)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  <circle cx="200" cy="245" r="6" fill="url(#coatDark)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  <circle cx="200" cy="275" r="6" fill="url(#coatDark)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  <circle cx="200" cy="305" r="6" fill="url(#coatDark)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  <!-- Button holes -->
  <circle cx="200" cy="185" r="2" fill="rgba(0,0,0,0.4)"/>
  <circle cx="200" cy="215" r="2" fill="rgba(0,0,0,0.4)"/>
  <circle cx="200" cy="245" r="2" fill="rgba(0,0,0,0.4)"/>
  <circle cx="200" cy="275" r="2" fill="rgba(0,0,0,0.4)"/>
  <circle cx="200" cy="305" r="2" fill="rgba(0,0,0,0.4)"/>

  <!-- Pocket left -->
  <path d="M 118 245 L 175 245 L 175 295 Q 175 305 165 305 L 128 305 Q 118 305 118 295 Z"
    fill="url(#coatShade)" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>
  <!-- Pocket right -->
  <path d="M 282 245 L 225 245 L 225 295 Q 225 305 235 305 L 272 305 Q 282 305 282 295 Z"
    fill="url(#coatShade)" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"/>

  <!-- Cuffs -->
  <rect x="33" y="300" width="88" height="18" rx="9" fill="url(#coatDark)"/>
  <rect x="279" y="300" width="88" height="18" rx="9" fill="url(#coatDark)"/>
  <!-- Bottom hem -->
  <rect x="102" y="340" width="196" height="12" rx="6" fill="url(#coatDark)"/>

  <!-- Coat shine -->
  <path d="M 115 175 Q 112 240 115 295" stroke="rgba(255,255,255,0.15)" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Rain drops bouncing off coat -->
  <circle cx="155" cy="168" r="3" fill="rgba(150,210,255,0.5)"/>
  <circle cx="245" cy="180" r="3" fill="rgba(150,210,255,0.5)"/>
  <circle cx="130" cy="210" r="2.5" fill="rgba(150,210,255,0.4)"/>

  <!-- Label -->
  <rect x="80" y="362" width="240" height="26" rx="13" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="200" y="380" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#fdebd0" text-anchor="middle" letter-spacing="1">RAINCOAT</text>
</svg>
