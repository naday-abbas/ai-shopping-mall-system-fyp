<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="50%" style="stop-color:#3d5a70"/>
      <stop offset="100%" style="stop-color:#2c3e50"/>
    </linearGradient>
    <linearGradient id="canopy1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="canopy2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="canopy3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#27ae60"/>
    </linearGradient>
    <linearGradient id="canopy4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6"/>
      <stop offset="100%" style="stop-color:#7f8c8d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <clipPath id="canopyClip">
      <path d="M 68 200 Q 200 60 332 200 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Rain drops -->
  <g stroke="rgba(150,200,255,0.35)" stroke-width="2" stroke-linecap="round">
    <line x1="45" y1="50" x2="38" y2="80"/>
    <line x1="75" y1="30" x2="68" y2="60"/>
    <line x1="330" y1="40" x2="323" y2="70"/>
    <line x1="360" y1="60" x2="353" y2="90"/>
    <line x1="38" y1="120" x2="31" y2="150"/>
    <line x1="60" y1="100" x2="53" y2="130"/>
    <line x1="345" y1="110" x2="338" y2="140"/>
    <line x1="368" y1="130" x2="361" y2="160"/>
    <line x1="48" y1="310" x2="41" y2="340"/>
    <line x1="72" y1="330" x2="65" y2="360"/>
    <line x1="335" y1="310" x2="328" y2="340"/>
    <line x1="358" y1="330" x2="351" y2="360"/>
    <line x1="30" y1="230" x2="23" y2="260"/>
    <line x1="372" y1="240" x2="365" y2="270"/>
  </g>
  <!-- Rain drops (smaller) -->
  <g stroke="rgba(150,200,255,0.2)" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="28" x2="95" y2="48"/>
    <line x1="300" y1="28" x2="295" y2="48"/>
    <line x1="120" y1="355" x2="115" y2="375"/>
    <line x1="280" y1="355" x2="275" y2="375"/>
    <line x1="22" y1="165" x2="17" y2="185"/>
    <line x1="378" y1="170" x2="373" y2="190"/>
  </g>

  <!-- Umbrella canopy base shape -->
  <path d="M 68 200 Q 134 85 200 70 Q 266 85 332 200 Z" fill="#2980b9" filter="url(#shadow)"/>

  <!-- Canopy panels (colored sections) -->
  <!-- Panel 1 - Blue -->
  <path d="M 68 200 Q 101 115 134 88 L 200 200 Z" fill="url(#canopy1)"/>
  <!-- Panel 2 - Red -->
  <path d="M 134 88 Q 167 70 200 70 L 200 200 Z" fill="url(#canopy2)"/>
  <!-- Panel 3 - Green -->
  <path d="M 200 70 Q 233 70 266 88 L 200 200 Z" fill="url(#canopy3)"/>
  <!-- Panel 4 - Orange -->
  <path d="M 266 88 Q 299 115 332 200 L 200 200 Z" fill="url(#canopy4)"/>

  <!-- Canopy rim (scalloped bottom edge) -->
  <path d="M 68 200 Q 84 218 100 210 Q 116 202 132 215 Q 148 228 164 218 Q 180 208 200 220 Q 220 232 236 218 Q 252 204 268 215 Q 284 226 300 212 Q 316 198 332 200"
    stroke="rgba(255,255,255,0.9)" stroke-width="3" fill="rgba(255,255,255,0.15)" stroke-linecap="round"/>

  <!-- Panel divider ribs -->
  <line x1="200" y1="200" x2="200" y2="75" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="134" y2="88" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="266" y2="88" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="68" y2="200" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>
  <line x1="200" y1="200" x2="332" y2="200" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"/>

  <!-- Canopy tip top -->
  <circle cx="200" cy="73" r="10" fill="url(#handle)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

  <!-- Umbrella shaft -->
  <line x1="200" y1="200" x2="200" y2="340" stroke="url(#handle)" stroke-width="7" stroke-linecap="round" filter="url(#shadow)"/>
  <!-- Shaft inner shine -->
  <line x1="202" y1="200" x2="202" y2="340" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>

  <!-- Curved handle -->
  <path d="M 200 340 Q 200 368 176 368 Q 152 368 152 350" stroke="url(#handle)" stroke-width="10" fill="none" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 200 340 Q 200 362 180 362 Q 162 362 162 350" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Canopy shine effect -->
  <path d="M 100 168 Q 145 115 185 100" stroke="rgba(255,255,255,0.2)" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Label -->
  <rect x="80" y="352" width="240" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="200" y="375" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#d6eaf8" text-anchor="middle" letter-spacing="1">UMBRELLA</text>
</svg>
