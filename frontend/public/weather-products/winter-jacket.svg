<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="jacketLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec7063"/>
      <stop offset="100%" style="stop-color:#e74c3c"/>
    </linearGradient>
    <linearGradient id="collar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#922b21"/>
      <stop offset="100%" style="stop-color:#78281f"/>
    </linearGradient>
    <linearGradient id="zipper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d5d8dc"/>
      <stop offset="100%" style="stop-color:#aab7b8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Snow flakes -->
  <g fill="rgba(255,255,255,0.15)" font-size="18">
    <text x="40" y="60">❄</text>
    <text x="340" y="55">❄</text>
    <text x="68" y="340">❄</text>
    <text x="318" y="345">❄</text>
    <text x="28" y="185">❄</text>
    <text x="355" y="200">❄</text>
  </g>
  <g fill="rgba(255,255,255,0.08)" font-size="12">
    <text x="90" y="38">❄</text>
    <text x="305" y="38">❄</text>
    <text x="95" y="368">❄</text>
    <text x="295" y="368">❄</text>
  </g>

  <!-- Jacket body -->
  <!-- Left arm -->
  <path d="M 100 165 L 68 170 Q 48 175 45 210 L 50 295 Q 52 308 70 308 L 118 305 Z"
    fill="url(#jacket)" filter="url(#shadow)"/>
  <!-- Right arm -->
  <path d="M 300 165 L 332 170 Q 352 175 355 210 L 350 295 Q 348 308 330 308 L 282 305 Z"
    fill="url(#jacket)" filter="url(#shadow)"/>

  <!-- Main body -->
  <path d="M 108 148 L 95 310 Q 95 330 115 330 L 285 330 Q 305 330 305 310 L 292 148 Z"
    fill="url(#jacket)" filter="url(#shadow)"/>

  <!-- Body highlight (left panel) -->
  <path d="M 112 150 L 100 308 L 195 308 L 195 150 Z" fill="url(#jacketLight)" opacity="0.4"/>

  <!-- Collar -->
  <path d="M 148 148 Q 148 122 175 112 L 200 108 L 225 112 Q 252 122 252 148 L 230 160 Q 215 148 200 148 Q 185 148 170 160 Z"
    fill="url(#collar)" filter="url(#shadow)"/>
  <!-- Collar inner -->
  <path d="M 165 150 Q 165 130 185 122 L 200 118 L 215 122 Q 235 130 235 150 L 218 160 Q 208 150 200 150 Q 192 150 182 160 Z"
    fill="#e74c3c"/>

  <!-- Zipper line -->
  <line x1="200" y1="150" x2="200" y2="325" stroke="url(#zipper)" stroke-width="4" stroke-linecap="round"/>
  <!-- Zipper teeth -->
  <g fill="url(#zipper)">
    <rect x="196" y="165" width="8" height="5" rx="1"/>
    <rect x="196" y="180" width="8" height="5" rx="1"/>
    <rect x="196" y="195" width="8" height="5" rx="1"/>
    <rect x="196" y="210" width="8" height="5" rx="1"/>
    <rect x="196" y="225" width="8" height="5" rx="1"/>
    <rect x="196" y="240" width="8" height="5" rx="1"/>
    <rect x="196" y="255" width="8" height="5" rx="1"/>
    <rect x="196" y="270" width="8" height="5" rx="1"/>
    <rect x="196" y="285" width="8" height="5" rx="1"/>
    <rect x="196" y="300" width="8" height="5" rx="1"/>
    <rect x="196" y="315" width="8" height="5" rx="1"/>
  </g>
  <!-- Zipper pull -->
  <rect x="193" y="155" width="14" height="10" rx="3" fill="#d5d8dc"/>

  <!-- Pocket left -->
  <rect x="118" y="235" width="58" height="48" rx="8" fill="rgba(0,0,0,0.2)" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  <!-- Pocket right -->
  <rect x="224" y="235" width="58" height="48" rx="8" fill="rgba(0,0,0,0.2)" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>

  <!-- Arm seam lines -->
  <path d="M 100 168 Q 82 185 78 250" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 300 168 Q 318 185 322 250" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cuffs -->
  <path d="M 50 285 Q 50 308 70 308 L 118 305 L 120 288 L 55 290 Z" fill="url(#collar)"/>
  <path d="M 350 285 Q 350 308 330 308 L 282 305 L 280 288 L 345 290 Z" fill="url(#collar)"/>

  <!-- Bottom hem -->
  <rect x="95" y="322" width="210" height="12" rx="6" fill="url(#collar)"/>

  <!-- Brand patch -->
  <rect x="225" y="250" width="50" height="30" rx="5" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="250" y="270" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.5)" text-anchor="middle">WINTER</text>

  <!-- Label -->
  <rect x="80" y="350" width="240" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="200" y="373" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#e8d5d5" text-anchor="middle" letter-spacing="1">WINTER JACKET</text>
</svg>
