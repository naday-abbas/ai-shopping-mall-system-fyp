<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#ff9ff3"/>
    </linearGradient>
    <linearGradient id="cone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8b86d"/>
      <stop offset="100%" style="stop-color:#c8892d"/>
    </linearGradient>
    <linearGradient id="scoop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9ff3"/>
      <stop offset="100%" style="stop-color:#f368e0"/>
    </linearGradient>
    <linearGradient id="scoop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea"/>
      <stop offset="100%" style="stop-color:#54b3d6"/>
    </linearGradient>
    <linearGradient id="scoop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7"/>
      <stop offset="100%" style="stop-color:#fdcb6e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Sun rays -->
  <g opacity="0.2">
    <circle cx="340" cy="60" r="40" fill="#fff"/>
    <line x1="340" y1="5" x2="340" y2="25" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="340" y1="95" x2="340" y2="115" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="285" y1="60" x2="305" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="375" y1="60" x2="395" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="301" y1="21" x2="315" y2="35" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="365" y1="85" x2="379" y2="99" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="301" y1="99" x2="315" y2="85" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="365" y1="35" x2="379" y2="21" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Waffle cone -->
  <polygon points="200,330 150,200 250,200" fill="url(#cone)" filter="url(#shadow)"/>
  <!-- Cone waffle pattern -->
  <line x1="170" y1="220" x2="230" y2="220" stroke="#b8722a" stroke-width="1.5" opacity="0.5"/>
  <line x1="162" y1="245" x2="238" y2="245" stroke="#b8722a" stroke-width="1.5" opacity="0.5"/>
  <line x1="155" y1="270" x2="245" y2="270" stroke="#b8722a" stroke-width="1.5" opacity="0.5"/>
  <line x1="148" y1="295" x2="252" y2="295" stroke="#b8722a" stroke-width="1.5" opacity="0.5"/>
  <line x1="184" y1="200" x2="178" y2="330" stroke="#b8722a" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="200" x2="200" y2="330" stroke="#b8722a" stroke-width="1.5" opacity="0.4"/>
  <line x1="216" y1="200" x2="222" y2="330" stroke="#b8722a" stroke-width="1.5" opacity="0.4"/>

  <!-- Scoop 3 (bottom) - Vanilla -->
  <ellipse cx="200" cy="205" rx="52" ry="48" fill="url(#scoop3)" filter="url(#shadow)"/>
  <ellipse cx="185" cy="192" rx="12" ry="10" fill="rgba(255,255,255,0.3)"/>

  <!-- Scoop 2 (middle) - Mint -->
  <ellipse cx="200" cy="160" rx="48" ry="45" fill="url(#scoop2)" filter="url(#shadow)"/>
  <ellipse cx="186" cy="148" rx="11" ry="9" fill="rgba(255,255,255,0.3)"/>

  <!-- Scoop 1 (top) - Strawberry -->
  <ellipse cx="200" cy="118" rx="45" ry="42" fill="url(#scoop1)" filter="url(#shadow)"/>
  <ellipse cx="186" cy="107" rx="10" ry="8" fill="rgba(255,255,255,0.3)"/>

  <!-- Chocolate drizzle -->
  <path d="M 200 80 Q 220 95 215 110 Q 210 125 225 130" stroke="#7d4f00" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 185 82 Q 170 100 175 115" stroke="#7d4f00" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Cherry on top -->
  <circle cx="200" cy="76" r="12" fill="#e74c3c" filter="url(#shadow)"/>
  <path d="M 200 64 Q 212 52 220 58" stroke="#27ae60" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Sprinkles -->
  <rect x="165" y="130" width="12" height="4" rx="2" fill="#e74c3c" transform="rotate(-30 171 132)"/>
  <rect x="228" y="138" width="12" height="4" rx="2" fill="#3498db" transform="rotate(20 234 140)"/>
  <rect x="155" y="155" width="10" height="4" rx="2" fill="#f39c12" transform="rotate(45 160 157)"/>
  <rect x="235" y="112" width="10" height="4" rx="2" fill="#9b59b6" transform="rotate(-15 240 114)"/>
  <rect x="172" y="100" width="10" height="4" rx="2" fill="#1abc9c" transform="rotate(60 177 102)"/>

  <!-- Label -->
  <rect x="80" y="348" width="240" height="38" rx="19" fill="rgba(255,255,255,0.9)"/>
  <text x="200" y="372" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#e84393" text-anchor="middle" letter-spacing="1">ICE CREAM</text>
</svg>
