<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7b733"/>
      <stop offset="50%" style="stop-color:#fc4a1a"/>
      <stop offset="100%" style="stop-color:#f7b733"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#fff5e0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff176"/>
      <stop offset="100%" style="stop-color:#ffca28"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>

  <!-- Decorative dots pattern -->
  <circle cx="40" cy="40" r="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="80" cy="55" r="5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="360" cy="40" r="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="320" cy="60" r="5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="40" cy="360" r="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="360" cy="360" r="8" fill="rgba(255,255,255,0.15)"/>

  <!-- Sun (top center) -->
  <circle cx="200" cy="100" r="52" fill="url(#sun)" filter="url(#shadow)"/>
  <!-- Sun rays -->
  <g stroke="#ffca28" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="30" x2="200" y2="15"/>
    <line x1="200" y1="170" x2="200" y2="185"/>
    <line x1="130" y1="100" x2="115" y2="100"/>
    <line x1="270" y1="100" x2="285" y2="100"/>
    <line x1="151" y1="51" x2="140" y2="40"/>
    <line x1="249" y1="51" x2="260" y2="40"/>
    <line x1="151" y1="149" x2="140" y2="160"/>
    <line x1="249" y1="149" x2="260" y2="160"/>
  </g>
  <!-- Smiley on sun -->
  <circle cx="186" cy="92" r="6" fill="#f57f17"/>
  <circle cx="214" cy="92" r="6" fill="#f57f17"/>
  <path d="M 182 110 Q 200 125 218 110" stroke="#f57f17" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Main sale badge -->
  <circle cx="200" cy="255" r="100" fill="url(#badge)" filter="url(#shadow)"/>
  <circle cx="200" cy="255" r="88" fill="none" stroke="#fc4a1a" stroke-width="4" stroke-dasharray="12,8"/>

  <!-- SALE text -->
  <text x="200" y="235" font-family="'Inter', Arial, sans-serif" font-size="44" font-weight="900" fill="#fc4a1a" text-anchor="middle" letter-spacing="-1">SALE</text>
  <!-- % off -->
  <text x="200" y="275" font-family="'Inter', Arial, sans-serif" font-size="20" font-weight="700" fill="#f57f17" text-anchor="middle">UP TO</text>
  <text x="200" y="308" font-family="'Inter', Arial, sans-serif" font-size="34" font-weight="900" fill="#fc4a1a" text-anchor="middle">50% OFF</text>

  <!-- Small stars -->
  <text x="108" y="248" font-size="22" fill="#f57f17">★</text>
  <text x="278" y="248" font-size="22" fill="#f57f17">★</text>
  <text x="140" y="295" font-size="16" fill="#fc4a1a" opacity="0.6">★</text>
  <text x="248" y="295" font-size="16" fill="#fc4a1a" opacity="0.6">★</text>

  <!-- Label -->
  <rect x="60" y="368" width="280" height="20" rx="0" fill="none"/>
  <rect x="60" y="350" width="280" height="38" rx="19" fill="rgba(255,255,255,0.9)"/>
  <text x="200" y="374" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#fc4a1a" text-anchor="middle" letter-spacing="1">SUMMER OFFERS</text>
</svg>
